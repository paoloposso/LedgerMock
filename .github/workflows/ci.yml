name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore LedgerMock.slnx

      - name: Build
        run: dotnet build LedgerMock.slnx --no-restore --configuration Release

      - name: Run Tests
        run: dotnet test LedgerMock.slnx --no-build --configuration Release --verbosity normal
